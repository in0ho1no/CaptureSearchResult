name: Build Check

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capture-search-result/package-lock.json

      - name: Install dependencies
        working-directory: capture-search-result
        env:
          # Block lifecycle scripts during installation; add targeted npm rebuild only if a future dependency truly requires it.
          NPM_CONFIG_IGNORE_SCRIPTS: true
        run: npm ci

      - name: Compile TypeScript
        working-directory: capture-search-result
        run: npm run compile

      - name: Package extension
        working-directory: capture-search-result
        run: npx @vscode/vsce package --no-yarn
