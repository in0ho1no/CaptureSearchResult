name: Build Check

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capture-search-result/package-lock.json

      - name: Install dependencies
        working-directory: capture-search-result
        env:
          # Block lifecycle scripts during installation; add targeted npm rebuild only if a future dependency truly requires it.
          NPM_CONFIG_IGNORE_SCRIPTS: true
        run: npm ci

      - name: Compile TypeScript
        working-directory: capture-search-result
        run: npm run compile

      - name: Package extension
        working-directory: capture-search-result
        run: npx @vscode/vsce package --no-yarn
